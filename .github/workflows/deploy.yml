name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Frontend Edge Engine
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis & Type Checking
        run: pnpm check

      - name: Build Astro SSR Distribution
        run: pnpm build

      - name: Deploy to Cloudflare Pages Engine
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'denysskobalodev-space'
          directory: './dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
